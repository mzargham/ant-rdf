# SPDX-License-Identifier: Apache-2.0
#
# Compile-and-diff: regenerate briefs and wiki from the canonical RDF; if
# the regenerated output differs from what's committed, fail the build with
# instructions to run `ant refresh` / `ant wiki` locally and commit the
# updated artifacts. This enforces the RIME determinism invariant for v1:
# same RDF → byte-identical compiled output.

name: compile-determinism

on:
  push:
    branches: [main]
  # Every PR, whatever its base — stacked PRs (a wave branched off the
  # previous wave) must be gated too.
  pull_request:

# One run per ref at a time; a newer push cancels the stale one.
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Regenerate every case's brief set
        # `ant refresh` walks the compiler registry, so every committed brief
        # (per-frame network briefs, comparisons, the cross-case catalog) is
        # covered by the gate — not just one hand-picked file.
        run: |
          for case in instances/cases/*/; do
            uv run ant refresh "$(basename "$case")"
          done

      - name: Regenerate wiki
        run: uv run ant wiki

      - name: Diff committed vs regenerated
        run: |
          if ! git diff --quiet briefs/ wiki/; then
            echo "::error::Committed briefs/ or wiki/ are out of sync with the canonical RDF."
            echo "Run \`ant refresh <case>\` for each case and \`ant wiki\` locally, then commit the regenerated artifacts."
            echo ""
            echo "Diff:"
            git diff --stat briefs/ wiki/
            git diff briefs/ wiki/ | head -200
            exit 1
          fi
          echo "✓ briefs and wiki are byte-identical to canonical RDF output"
