# SPDX-License-Identifier: Apache-2.0
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref at a time; a newer push cancels the stale one.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ontology parses
        run: uv run ant ontology validate

      - name: ant verify (SHACL + cross-refs, tri-severity)
        # CI default per R9b: warnings surface in the log but do not break.
        # Tier-1 violations break the build.
        run: uv run ant verify

      - name: ruff
        run: uv run ruff check src tests

      - name: pytest
        run: uv run pytest -x
